<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lista de invitados</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#2a24d9;--paper:#fbf8ef;--ink:#17133f;--muted:#5d5a7d;--line:#cfc9e8;--hot:#ff4f9a;--err:#c2184b}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:400 16px/1.45 Figtree,system-ui,sans-serif;padding:28px 16px 64px}
main{max-width:560px;margin:0 auto}
h1{font:800 clamp(2.5rem,10vw,3.8rem)/.95 "Bricolage Grotesque",Georgia,sans-serif;color:var(--paper);margin:8px 0 12px;letter-spacing:-.02em}
.sub{color:#dcd9ff;margin:0 0 26px;max-width:44ch}
.card{background:var(--paper);border-radius:14px}
.top,.bottom{padding:22px}
.perf{position:relative;border-top:2px dashed var(--line);margin:0 18px}
.perf::before,.perf::after{content:"";position:absolute;top:-13px;width:24px;height:24px;border-radius:50%;background:var(--bg)}
.perf::before{left:-30px}.perf::after{right:-30px}
label,.t{font-weight:600}
select,input{display:block;width:100%;font:inherit;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:12px;margin-top:8px}
select:focus-visible,input:focus-visible,button:focus-visible{outline:3px solid var(--hot);outline-offset:2px}
[aria-invalid=true]{border-color:var(--err)}
.guest{padding:16px 0 6px;border-top:1px solid var(--line)}
.guest:first-child{border-top:0;padding-top:0}
.head{display:flex;justify-content:space-between;align-items:center}
.del{background:none;border:0;color:var(--muted);font:inherit;text-decoration:underline;cursor:pointer;padding:4px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
@media(max-width:480px){.row{grid-template-columns:1fr}}
.err{color:var(--err);font-size:.92rem;margin:8px 0 0}
.add{width:100%;margin-top:16px;padding:12px;border:2px dashed var(--ink);background:transparent;border-radius:10px;font:600 1rem Figtree,sans-serif;color:var(--ink);cursor:pointer}
.send{width:100%;margin-top:12px;padding:16px;border:0;border-radius:10px;background:var(--hot);color:var(--ink);font:800 1.15rem "Bricolage Grotesque",sans-serif;cursor:pointer}
.send:disabled{opacity:.6;cursor:wait}
#msg{margin:12px 0 0;font-weight:600;color:var(--err)}
.done{padding:28px 22px;text-align:center}
.done h2{font:800 2rem/1 "Bricolage Grotesque",sans-serif;margin:0 0 10px}
.done .add{max-width:280px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <h1>Lista de invitados</h1>
  <p class="sub">Elegí quién sos y cargá a tus invitados con nombre completo, DNI y mail.</p>

  <div class="card">
    <form id="form" novalidate>
      <div class="top">
        <label for="inv">¿Quién sos?</label>
        <select id="inv"><option value="">Cargando…</option></select>
      </div>
      <div class="perf"></div>
      <div class="bottom">
        <div id="lista"></div>
        <button type="button" class="add" id="mas">+ Agregar otro invitado</button>
        <button type="submit" class="send" id="enviar">Enviar lista</button>
        <p id="msg" role="alert"></p>
      </div>
    </form>
    <div class="done" id="done" hidden>
      <h2 id="doneTxt"></h2>
      <p>Ya quedaron guardados.</p>
      <button type="button" class="add" id="otra">Cargar más invitados</button>
    </div>
  </div>
</main>

<script>
// Datos públicos de tu proyecto Supabase (la publishable key está pensada para ir en el front)
const SB = "https://epjsjudvzrcdbgiqffno.supabase.co/rest/v1";
const KEY = "sb_publishable_6J9Li5m-52jwCdd6sXYWLw_WVa0qyGM";
const H = { apikey: KEY, "Content-Type": "application/json" };

const $ = s => document.querySelector(s);
const form = $("#form"), sel = $("#inv"), lista = $("#lista"), msg = $("#msg"), btn = $("#enviar");

// 1) Traer los invitadores para el desplegable
async function cargarInvitadores() {
  try {
    const r = await fetch(`${SB}/invitadores?select=id,nombre&order=nombre.asc`, { headers: H });
    if (!r.ok) throw new Error(r.status);
    const data = await r.json();
    sel.replaceChildren(new Option("Elegí tu nombre…", ""));
    data.forEach(i => sel.add(new Option(i.nombre, i.id)));
  } catch (e) {
    sel.replaceChildren(new Option("No se pudo cargar la lista", ""));
    msg.textContent = "No pudimos cargar los invitadores. Recargá la página.";
  }
}

// 2) Filas de invitados
function nuevo() {
  const g = document.createElement("div");
  g.className = "guest";
  g.setAttribute("role", "group");
  g.innerHTML = `
    <div class="head"><span class="t"></span><button type="button" class="del">Quitar</button></div>
    <input name="nombre" placeholder="Nombre completo" aria-label="Nombre completo" autocomplete="off">
    <div class="row">
      <input name="dni" placeholder="DNI (sin puntos)" aria-label="DNI" inputmode="numeric" autocomplete="off">
      <input name="email" type="email" placeholder="Mail" aria-label="Mail" autocomplete="off">
    </div>
    <p class="err" role="alert"></p>`;
  lista.append(g);
  numerar();
  return g;
}
function numerar() {
  [...lista.children].forEach((g, i) => {
    g.querySelector(".t").textContent = "Invitado " + (i + 1);
    g.setAttribute("aria-label", "Invitado " + (i + 1));
    g.querySelector(".del").hidden = lista.children.length === 1;
  });
}
$("#mas").onclick = () => nuevo().querySelector("input").focus();
lista.addEventListener("click", e => {
  if (e.target.classList.contains("del")) { e.target.closest(".guest").remove(); numerar(); }
});

// 3) Validar y mandar a Supabase
const reMail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
form.addEventListener("submit", async e => {
  e.preventDefault();
  msg.textContent = "";
  sel.removeAttribute("aria-invalid");
  if (!sel.value) {
    sel.setAttribute("aria-invalid", "true");
    msg.textContent = "Elegí quién sos.";
    sel.focus();
    return;
  }

  const filas = [], dnis = new Set();
  let primerError = null;
  for (const g of lista.children) {
    const campo = n => g.querySelector(`[name=${n}]`);
    g.querySelectorAll("input").forEach(i => i.removeAttribute("aria-invalid"));
    g.querySelector(".err").textContent = "";

    const nombre = campo("nombre").value.trim().replace(/\s+/g, " ").toUpperCase();
    const dni = campo("dni").value.replace(/[.\s]/g, "");
    const email = campo("email").value.trim().toLowerCase();

    let malo = null, texto = "";
    if (nombre.split(" ").length < 2) { malo = "nombre"; texto = "Poné nombre y apellido."; }
    else if (!/^\d{7,8}$/.test(dni)) { malo = "dni"; texto = "El DNI tiene que tener 7 u 8 números."; }
    else if (dnis.has(dni)) { malo = "dni"; texto = "Este DNI está repetido en tu lista."; }
    else if (!reMail.test(email)) { malo = "email"; texto = "Revisá el mail."; }

    if (malo) {
      campo(malo).setAttribute("aria-invalid", "true");
      g.querySelector(".err").textContent = texto;
      primerError ??= campo(malo);
    } else {
      dnis.add(dni);
      filas.push({ invitador_id: Number(sel.value), nombre, dni, email });
    }
  }
  if (primerError) { primerError.focus(); return; }

  btn.disabled = true;
  btn.textContent = "Enviando…";
  try {
    const r = await fetch(`${SB}/invitados`, {
      method: "POST",
      headers: { ...H, Prefer: "return=minimal" },
      body: JSON.stringify(filas) // todos juntos: o se guardan todos o ninguno
    });
    if (r.ok) {
      $("#doneTxt").textContent = filas.length === 1 ? "Listo, 1 invitado cargado" : `Listo, ${filas.length} invitados cargados`;
      form.hidden = true;
      $("#done").hidden = false;
    } else {
      const j = await r.json().catch(() => ({}));
      msg.textContent = j.code === "23505"
        ? "Uno de esos DNI ya estaba cargado. Revisalos."
        : "No se pudo guardar. Probá de nuevo en un rato.";
    }
  } catch (err) {
    msg.textContent = "Sin conexión. Probá de nuevo.";
  }
  btn.disabled = false;
  btn.textContent = "Enviar lista";
});

$("#otra").onclick = () => {
  lista.replaceChildren();
  nuevo();
  $("#done").hidden = true;
  form.hidden = false;
};

nuevo();
cargarInvitadores();
</script>
</body>
</html>
